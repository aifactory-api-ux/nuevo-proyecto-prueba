services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dispatch-api
    network_mode: host
    environment:
      - DATABASE_URL=sqlite:///./app.db
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=23001

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: distro-viz-frontend
    network_mode: host
    environment:
      - VITE_API_URL=http://localhost:23001/api
    depends_on:
      - backend