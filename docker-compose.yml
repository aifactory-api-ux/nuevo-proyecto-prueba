services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dispatch-api
    ports:
      - "23001:23001"
    environment:
      - DATABASE_URL=sqlite:///./app.db
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=23001

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: distro-viz-frontend
    ports:
      - "23002:23002"
    environment:
      - VITE_API_URL=http://backend:23001/api
    depends_on:
      - backend